spring.application.name=capsuleai-backend
server.address=127.0.0.1
server.port=8080

spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# US-AUTH-001 / NFR-SEC-003: keep row values (for example password hashes)
# out of PostgreSQL driver exception messages and therefore out of logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false


# Browser origins that may call the API cross-origin (CORS): comma-separated
# exact origins such as https://app.example.com. Empty by default, so no other
# origin is granted access until a deployment lists its trusted web clients.
capsuleai.cors.allowed-origins=${CAPSULE_CORS_ALLOWED_ORIGINS:}

# US-AUTH-005: never let an unresponsive mail server block a delivery thread
# (default JavaMail timeouts are infinite). Values are milliseconds.
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# US-AUTH-005 (OPEN-S2-04/05): password-reset abuse protection. Conservative technical
# defaults (TD-S2-26), tune per deployment. Counted per fixed window: requests per
# normalized email and per client address; link checks and completions per client.
capsuleai.identity.password-reset.protection.request-per-email-max-attempts=3
capsuleai.identity.password-reset.protection.request-per-client-max-attempts=20
capsuleai.identity.password-reset.protection.verification-per-client-max-attempts=30
capsuleai.identity.password-reset.protection.window=PT15M
# Every successful Forgot Password request lasts at least this long (timing hardening).
capsuleai.identity.password-reset.protection.minimum-request-response-time=PT0.25S

# US-AUTH-005 (OPEN-S2-07): delete ended reset interactions 30 days after they end.
capsuleai.identity.password-reset.cleanup.enabled=true
capsuleai.identity.password-reset.cleanup.initial-delay=PT1M
capsuleai.identity.password-reset.cleanup.interval=PT1H
capsuleai.identity.password-reset.cleanup.batch-size=500

# OPEN-S2-02: production instruction links must be https (verified App/Universal Link
# domain, supplied by the deployment). Only local development may use a custom scheme.
capsuleai.identity.password-reset.development-custom-scheme-allowed=false


# US-GAR-003: photos arrive as multipart through the application (S3-IMG-02). These servlet limits
# are only a transport guard above the photo rule; the application enforces the exact rule itself.
# resolve-lazily lets size errors reach the Wardrobe error handler; max-swallow-size lets clients
# read the 422 instead of a reset connection.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB
spring.servlet.multipart.resolve-lazily=true
server.tomcat.max-swallow-size=20MB

# US-GAR-003 photo rules (FR-AI-012), approved by the Product Owner on 2026-11-11:
# maximum-bytes (OPEN-S3-09), derivative-long-edge (OPEN-S3-10), decoding bounds (OPEN-S3-12).
# The decoding bounds are safety ceilings still to be measured on the deployment size (OPEN-S3-12).
capsuleai.wardrobe.photo.maximum-bytes=15000000
capsuleai.wardrobe.photo.minimum-shortest-side=512
capsuleai.wardrobe.photo.derivative-long-edge=2048
capsuleai.wardrobe.photo.maximum-declared-pixels=250000000
capsuleai.wardrobe.photo.decode-timeout=PT20S
capsuleai.wardrobe.photo.maximum-concurrent-decodes=2
# OPEN-S3-08 (approved; verification V1-V8 still required): libheif's decoder and its image lister,
# from the same installation. Some distributions name the decoder heif-convert.
capsuleai.wardrobe.photo.heif-decoder-command=${CAPSULE_HEIF_DECODER:heif-dec}
capsuleai.wardrobe.photo.heif-info-command=${CAPSULE_HEIF_INFO:heif-info}
# OPEN-S3-11 (approved): the target is the primary image of a multi-image HEIF. Keep false (the approved
# temporary fail-closed fallback: reject such files explicitly) until V4 and V8 pass for this libheif.
capsuleai.wardrobe.photo.heif-primary-image-selection=false

# US-GAR-003 pending-photo lifecycle (S3-IMG-08). The pending TTL of 24 hours was approved by the
# Product Owner on 2026-11-11 (OPEN-S3-07). The fence must exceed the storage call timeout plus twice
# the decode timeout; startup fails otherwise.
capsuleai.wardrobe.photo-upload.pending-ttl=PT24H
capsuleai.wardrobe.photo-upload.in-flight-fence=PT5M
capsuleai.wardrobe.photo-upload.cleanup.enabled=true
capsuleai.wardrobe.photo-upload.cleanup.initial-delay=PT1M
capsuleai.wardrobe.photo-upload.cleanup.interval=PT5M
capsuleai.wardrobe.photo-upload.cleanup.batch-size=100
capsuleai.wardrobe.photo-upload.cleanup.retry-delay=PT10M

# US-GAR-003 private photo bucket (S3-IMG-01, OPEN-S3-13). Empty endpoint means Amazon S3; empty
# access key means the AWS default credential chain. Never commit real credentials.
capsuleai.wardrobe.photo-storage.bucket=${CAPSULE_PHOTO_BUCKET:}
capsuleai.wardrobe.photo-storage.region=${CAPSULE_PHOTO_REGION:ap-southeast-1}
capsuleai.wardrobe.photo-storage.endpoint=${CAPSULE_PHOTO_ENDPOINT:}
capsuleai.wardrobe.photo-storage.access-key-id=${CAPSULE_PHOTO_ACCESS_KEY_ID:}
capsuleai.wardrobe.photo-storage.secret-access-key=${CAPSULE_PHOTO_SECRET_ACCESS_KEY:}
capsuleai.wardrobe.photo-storage.call-timeout=PT30S
capsuleai.wardrobe.photo-storage.conditional-writes=true
capsuleai.wardrobe.photo-storage.path-style=false

# US-GAR-005 removal cleanup (S4-GAR-03; values are OPEN-S4-04/33 delegated defaults selected on
# 2026-11-16). The purge limit implements the approved 30-day physical-deletion obligation and may not
# exceed P30D (startup fails otherwise). Obligations still incomplete after overdue-warning-age are
# logged as a warning. Physical deletion also requires the unversioned-bucket boundary of OPEN-S4-05.
capsuleai.wardrobe.removal-cleanup.enabled=true
capsuleai.wardrobe.removal-cleanup.initial-delay=PT2M
capsuleai.wardrobe.removal-cleanup.interval=PT5M
capsuleai.wardrobe.removal-cleanup.batch-size=50
capsuleai.wardrobe.removal-cleanup.retry-delay=PT15M
capsuleai.wardrobe.removal-cleanup.purge-limit=P30D
capsuleai.wardrobe.removal-cleanup.overdue-warning-age=P21D

# US-CTX-001 weather (S4-CTX-03/05; OPEN-S4-20/22/24/33 delegated defaults). Open-Meteo terms of use,
# attribution and eligibility for this deployment are NOT verified: confirm them, or set enabled=false (the API
# then reports NOT_CONFIGURED). The acquisition deadline implements the approved 2-second limit; startup fails
# above PT2S. The base URL must be https. No API key is used or stored. CAPSULE_WEATHER_ENABLED=false switches the
# provider off without a code change; the local profile defaults to off (application-local.properties).
capsuleai.personal-context.weather.enabled=${CAPSULE_WEATHER_ENABLED:true}
capsuleai.personal-context.weather.base-url=https://api.open-meteo.com
capsuleai.personal-context.weather.acquisition-deadline=PT2S
capsuleai.personal-context.weather.maximum-concurrent-requests=8
capsuleai.personal-context.weather.maximum-response-bytes=65536
capsuleai.personal-context.weather.attribution=Weather data by Open-Meteo.com

# US-BULK-001 admission and lifecycle (S4-BULK-06 approved; values are OPEN-S4-25 delegated defaults, Product
# Owner review advised). 20 items x 15,000,000 bytes per photo bounds one batch at 300,000,000 original bytes.
capsuleai.wardrobe.bulk-import.maximum-items-per-batch=20
capsuleai.wardrobe.bulk-import.maximum-active-batches=3
capsuleai.wardrobe.bulk-import.batch-lifetime=P7D