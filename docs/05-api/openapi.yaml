          title: "Sleeveless"
        - const: CAP_SLEEVE
          title: "Cap Sleeve"
        - const: SHORT_SLEEVE
          title: "Short Sleeve"
        - const: THREE_QUARTER_SLEEVE
          title: "3/4 Sleeve"
        - const: LONG_SLEEVE
          title: "Long Sleeve"

    GarmentLengthCode:
      type: string
      description: |
        CROPPED, WAIST, HIP, KNEE for TOPS; SHORT, LONG for PANTS.
      oneOf:
        - const: CROPPED
          title: "Cropped"
        - const: WAIST
          title: "Waist"
        - const: HIP
          title: "Hip"
        - const: KNEE
          title: "Knee"
        - const: SHORT
          title: "Short"
        - const: LONG
          title: "Long"

    GarmentSilhouetteCode:
      type: string
      description: |
        PANTS only.
      oneOf:
        - const: FLARE
          title: "Flare"
        - const: SLIM
          title: "Slim"
        - const: TAPERED
          title: "Tapered"
        - const: BAGGY
          title: "Baggy"
        - const: SKINNY
          title: "Skinny"
        - const: BOOTCUT
          title: "Bootcut"
        - const: WIDE_LEG
          title: "Wide-leg"

    FieldError:
      type: object
      description: A validation failure associated with a request field.
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: |
            Name of the invalid request field, a position such as
            materials[1], styles[0] or price.amount, the
            Idempotency-Key header, or the limit or cursor query
            parameter.
          examples:
            - "email"
            - "price.amount"

        code:
          type: string
          description: |
            Stable validation reason identifier.

            REQUIRED is used for missing required values.
          enum:
            - REQUIRED
            - INVALID_FORMAT
            - TOO_SHORT
            - TOO_LONG
            - INVALID_CHARACTERS
            - MISMATCH
            - NOT_CONFIRMED
            - UNSUPPORTED_VALUE
            - NOT_IN_CATEGORY
            - NOT_APPLICABLE
            - INCOMPLETE_PRICE
            - INVALID_AMOUNT
            - TOO_MANY_DECIMALS
            - UNSUPPORTED_CURRENCY
            - OUT_OF_RANGE

    Problem:
      type: object
      description: |
        CapsuleAI error response based on RFC 9457 Problem
        Details. Errors use application/problem+json.

        Clients branch on the stable code, not on detail.

        Authentication and infrastructure errors must not
        expose passwords, tokens, SQL, exception messages,
        connection strings, or internal system details.
      required:
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          description: |
            Problem type URI. Present as about:blank on
            responses from the security layer; omitted on
            responses from an endpoint, which RFC 9457 also
            defines as about:blank.
          examples:
            - "about:blank"

        instance:
          type: string
          description: |
            Path of the request. Present on responses from
            an endpoint; absent on responses from the
            security layer.
          examples:
            - "/api/v1/auth/registrations"

        title:
          type: string
          description: Short HTTP problem title.
          examples:
            - "Bad Request"

        status:
          type: integer
          description: HTTP response status.
          examples:
            - 400

        detail:
          type: string
          description: Safe human-readable explanation.

        code:
          type: string
          description: Stable application error identifier.
          examples:
            - "VALIDATION_FAILED"
            - "MALFORMED_REQUEST"
            - "INVALID_CREDENTIALS"
            - "AUTHENTICATION_REQUIRED"
            - "PASSWORD_RESET_INVALID"
            - "IDEMPOTENCY_KEY_REUSED"
            - "TEMPORARILY_UNAVAILABLE"

        fieldErrors:
          type: array
          description: |
            Present when individual request fields failed
            validation.
          items:
            $ref: "#/components/schemas/FieldError"

  examples:
    PasswordResetInvalid:
      summary: Reset link unknown, expired, used or replaced
      value:
        title: "Bad Request"
        status: 400
        detail: "This password-reset link can no longer be used. If you just set a new password, log in with it; otherwise request a new link."
        instance: "/api/v1/auth/password-reset/complete"
        code: "PASSWORD_RESET_INVALID"

  responses:
    RateLimited:
      description: |
        Too many password-reset requests for this email address, or
        too many requests, link checks or completions from this
        client, in the current window (FR-AUTH-019). The same body
        is returned for every limit and for registered and
        unregistered addresses; nothing was sent or changed.
      headers:
        Retry-After:
          description: Seconds until the current window ends.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: "Too Many Requests"
            status: 429
            detail: "Too many password-reset attempts. Wait a little and try again."
            instance: "/api/v1/auth/password-reset/request"
            code: "RATE_LIMITED"

    GarmentRejected:
      description: |
        The entry was not saved. VALIDATION_FAILED lists every
        missing, unconfirmed, unsupported or inapplicable value so
        the client can keep the draft and correct or clear them;
        MALFORMED_REQUEST means the body is not valid JSON.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            inapplicableDetail:
              summary: A Tops-only detail on Shoes
              value:
                title: "Bad Request"
                status: 400
                detail: "Some garment values are missing, unconfirmed or not allowed. Correct or clear them and confirm again; nothing was saved."
                instance: "/api/v1/wardrobe/garments"
                code: "VALIDATION_FAILED"
                fieldErrors:
                  - field: "fit"
                    code: "NOT_APPLICABLE"

    PageRequestRejected:
      description: |
        The limit is not an integer from 1 to 100, or the cursor
        is not a nextCursor this API issued (INVALID_FORMAT). No
        garment was read; load the wardrobe again from the first
        page.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: "Bad Request"
            status: 400
            detail: "This page of the wardrobe cannot be loaded. Load the wardrobe again from the first page."
            instance: "/api/v1/wardrobe/garments"
            code: "VALIDATION_FAILED"
            fieldErrors:
              - field: "cursor"
                code: "INVALID_FORMAT"

    IdempotencyKeyReused:
      description: |
        The Idempotency-Key was already used for a garment with
        different values. Nothing was saved; use a new key for a
        new garment.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: "Unprocessable Content"
            status: 422
            detail: "This Idempotency-Key was already used for a different garment. Use a new key for a new garment; nothing was saved."
            instance: "/api/v1/wardrobe/garments"
            code: "IDEMPOTENCY_KEY_REUSED"

    BadRequest:
      description: |
        Request validation failed or the JSON request
        could not be parsed. Every invalid field is listed;
        nothing was stored or changed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            missingRequiredField:
              summary: Missing required field
              value:
                title: "Bad Request"
                status: 400
                detail: "Some submitted values are missing or invalid. Correct them and submit again."
                instance: "/api/v1/auth/registrations"
                code: "VALIDATION_FAILED"
                fieldErrors:
                  - field: "confirmPassword"
                    code: "REQUIRED"

            missingRefreshToken:
              summary: Missing refresh token
              value:
                title: "Bad Request"
                status: 400
                detail: "Some submitted values are missing or invalid. Correct them and submit again."
                instance: "/api/v1/auth/refresh"
                code: "VALIDATION_FAILED"
                fieldErrors:
                  - field: "refreshToken"
                    code: "REQUIRED"

            malformedJson:
              summary: Malformed JSON
              value:
                title: "Bad Request"
                status: 400
                detail: "The request body is missing or is not valid JSON."
                instance: "/api/v1/auth/registrations"
                code: "MALFORMED_REQUEST"

    EmailConflict:
      description: |
        The normalized email is already registered.
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: "Conflict"
            status: 409
            detail: "An account already exists for this email. Log in, or use Forgot Password to recover access."
            instance: "/api/v1/auth/registrations"
            code: "EMAIL_ALREADY_REGISTERED"

    InvalidCredentials:
      description: |
        The email/password combination is invalid.

        Unknown email addresses and incorrect passwords
        produce identical responses. No session is created.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: "Unauthorized"
            status: 401
            detail: "The email or password is incorrect. Check them and try again, or use Forgot Password."
            instance: "/api/v1/auth/login"
            code: "INVALID_CREDENTIALS"

    Unauthorized:
      description: |
        The bearer access token cannot authorize this
        protected request: it is missing, malformed, signed
        with another key, from another issuer, expired, or
        its login session is revoked, expired or unknown.

        Returned by the security layer before the endpoint
        runs, so nothing was changed.
      headers:
        WWW-Authenticate:
          description: |
            Bearer authentication challenge (RFC 6750).
            Starts with "Bearer"; contains
            error="invalid_token" when a presented token was
            rejected, and may carry further standard parameters.
          schema:
            type: string
          example: 'Bearer error="invalid_token"'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: "Unauthorized"
            status: 401
            detail: "Authentication is required. Log in again to continue."
            code: "AUTHENTICATION_REQUIRED"

    RenewalRejected:
      description: |
        The refresh token cannot renew access: it is unknown,
        already consumed, or its session is revoked or
        expired. The client must log in again.

        A consumed refresh token presented while its session
        was still usable revokes that session before this
        response is returned. No WWW-Authenticate challenge
        is sent, because the credential is the request body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: "Unauthorized"
            status: 401
            detail: "Your session can no longer be renewed. Log in again to continue."
            instance: "/api/v1/auth/refresh"
            code: "AUTHENTICATION_REQUIRED"

    Unavailable:
      description: |
        A required dependency, PostgreSQL, could not be
        reached. The request is not reported as successful,
        the presented credential was not found invalid, and
        no private data or internal detail is disclosed.
        No WWW-Authenticate challenge is sent.

        accessNotVerified: on a protected endpoint, the
        security layer could not check session authority and
        denied access before the endpoint ran (fail closed).

        outcomeNotConfirmed: the database failed while the
        endpoint processed the request. The client should
        check the result or retry; for logout it must treat
        the session as not confirmed revoked.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            accessNotVerified:
              summary: Session authority could not be checked
              value:
                type: "about:blank"
                title: "Service Unavailable"
                status: 503
                detail: "Your access could not be verified right now. Nothing was changed. Try again shortly."
                code: "TEMPORARILY_UNAVAILABLE"

            outcomeNotConfirmed:
              summary: Database failed during the operation
              value:
                title: "Service Unavailable"
                status: 503
                detail: "The request could not be completed and its outcome is not confirmed. Check the result or retry."
                instance: "/api/v1/auth/login"
                code: "TEMPORARILY_UNAVAILABLE"
