openapi: 3.1.0

info:
  title: CapsuleAI API
  version: 0.7.0
  description: |
    CapsuleAI Sprint 1 — Secure Account Access, extended in Sprint 2
    (Backend Only).

    Covers:
      - US-AUTH-001: Register an account
      - US-AUTH-002: Log in to a private account
      - US-AUTH-004: Log out of the current session
      - US-AUTH-003: Resume access through refresh-token rotation
      - US-AUTH-005: Recover account access through email
      - US-GAR-001: Add an owned garment manually
      - US-WAR-001: Browse my current wardrobe

    Authentication model:
      - Access tokens are HS256-signed JWTs.
      - Access tokens last at most 15 minutes.
      - Each login creates a separate PostgreSQL-backed session.
      - A session has an absolute maximum lifetime of 30 days.
      - Access is granted only when both the JWT and its
        PostgreSQL session are usable.
      - Refresh tokens are opaque, rotated after successful use,
        and never accepted twice.
      - Reuse of a consumed refresh token revokes its session.
      - Logout revokes only the current session.
      - An accepted password reset revokes every active session
        of the account.

    Registration, login, refresh and the three password-reset
    operations are public endpoints. Logout requires a valid
    bearer access token.

    A 401 means the presented credential is not acceptable.
    A 503 means a required dependency (PostgreSQL) could not
    be reached: the credential was not found invalid and the
    outcome is not confirmed. Neither ever returns private data.

    Browser clients on another origin, such as the Swagger
    Editor, can call the API only from origins the server is
    configured to allow (see "Browser access (CORS)" in the
    backend README). CORS does not replace authentication.

    Wardrobe operations act only on the authenticated account's
    own garments. Every garment has exactly the 13 approved
    properties; controlled values are codes whose approved labels
    are listed in the vocabulary schemas. Recommendation
    eligibility is not evaluated in this release, and no garment
    image is stored.

    This specification does not introduce endpoints for
    session listing, all-device logout, garment editing or
    removal, garment images, search,
    wardrobe data, or user profiles.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Identity
    description: Account registration and authentication lifecycle
  - name: Wardrobe
    description: The authenticated user's own confirmed garments

# Every endpoint requires bearer authentication unless it
# explicitly overrides this requirement with security: [].
security:
  - bearerAuth: []

paths:
  /api/v1/auth/registrations:
    post:
      tags:
        - Identity
      operationId: registerAccount
      summary: Register a new account
      description: |
        US-AUTH-001.

        Creates an account using an email address, a password
        and a matching password confirmation (FR-AUTH-001,
        FR-AUTH-012).

        Email identity is normalized by trimming surrounding
        whitespace and applying case-insensitive comparison.
        Equivalent normalized email addresses cannot be
        registered twice, including under concurrent requests.

        Passwords must contain between 12 and 128 Unicode
        code points. The password value is preserved exactly:
        it is not trimmed, lowercased, or Unicode-normalized.
        The confirmation must equal the password exactly.

        A display name is optional.

        Every invalid field is reported in one 400 response;
        nothing is stored when any field is rejected.

        Registration does not automatically create a login
        session or issue access and refresh tokens.

      security: []

      requestBody:
        required: true
        description: Account registration details.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
            examples:
              withDisplayName:
                summary: Registration with display name
                value:
                  email: " Person@Example.com "
                  password: "correct horse battery staple"
                  confirmPassword: "correct horse battery staple"
                  displayName: "Person"
              withoutDisplayName:
                summary: Registration without optional display name
                value:
                  email: "person@example.com"
                  password: "correct horse battery staple"
                  confirmPassword: "correct horse battery staple"

      responses:
        "201":
          description: |
            Account created successfully.
            Does not issue authentication tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
              example:
                accountId: "a61b2b35-8b7e-4c51-93d1-51d81a4d82e2"
                email: "person@example.com"
                displayName: "Person"

        "400":
          $ref: "#/components/responses/BadRequest"

        "409":
          $ref: "#/components/responses/EmailConflict"

        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/login:
    post:
      tags:
        - Identity
      operationId: logIn
      summary: Log in to a private account
      description: |
        US-AUTH-002.

        Authenticates an existing account using its normalized
        email address and exact password.

        On success:
          - Creates a new, independent login session.
          - Persists the session in PostgreSQL.
          - Issues an HS256 JWT access token.
          - Issues an opaque refresh token.
          - Returns the account ID and token expiry times.

        The access token expires after at most 15 minutes.
        The session expires at most 30 days after login.
        Access-token expiry is capped by session expiry.

        Wrong passwords and unknown email addresses produce
        the same INVALID_CREDENTIALS response. The API does
        not disclose which part of the credentials was wrong.

        Logging in on another device creates a separate
        session without invalidating existing usable sessions.

      security: []

      requestBody:
        required: true
        description: Email and password credentials.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: " Person@Example.com "
              password: "correct horse battery staple"

      responses:
        "200":
          description: |
            Authentication succeeded and a new session was
            established. Both tokens are returned.
          headers:
            Cache-Control:
              description: |
                Prevents storage of authentication responses.
                Spring Security supplies no-store directives.
              schema:
                type: string
              example: "no-cache, no-store, max-age=0, must-revalidate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                tokenType: "Bearer"
                accountId: "a61b2b35-8b7e-4c51-93d1-51d81a4d82e2"
                accessToken: "eyJhbGciOiJIUzI1NiJ9.example.signature"
                accessTokenExpiresAt: "2026-11-03T10:15:00Z"
                refreshToken: "q8lC2vExampleOpaqueRefreshToken"
                sessionExpiresAt: "2026-12-03T10:00:00Z"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/InvalidCredentials"

        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/logout:
    post:
      tags:
        - Identity
      operationId: logOut
      summary: Log out of the current session
      description: |
        US-AUTH-004.

        Requires a valid, unexpired JWT access token and
        a usable PostgreSQL-backed login session.

        The server identifies the session from the
        authenticated principal, not from a request body.

        Revokes only the current session. Other sessions
        belonging to the same account remain usable.

        After revocation:
          - The current session's access tokens are rejected,
            even if their JWT signatures and expiry times
            are still valid.
          - Its refresh tokens cannot renew access.
          - Account and personal data remain unchanged.

        A 204 response confirms server-side revocation.

        A 401 response means the presented access token
        cannot authorize logout. It does not necessarily
        prove that the session was revoked: the access token
        may simply have expired.

        When the access token has expired, the client can
        first call /api/v1/auth/refresh and then call this
        endpoint with the new access token.

        A 503 response or network timeout does not confirm
        logout. The client should keep private content hidden
        and handle the outcome as unconfirmed.

      # Inherits the global bearerAuth requirement.

      responses:
        "204":
          description: |
            The current login session is revoked.
            The response has no body.

        "401":
          $ref: "#/components/responses/Unauthorized"

        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/refresh:
    post:
      tags:
        - Identity
      operationId: refreshSession
      summary: Renew access within the current login session
      description: |
        US-AUTH-003.

        Exchanges the current opaque refresh token for:
          - A new JWT access token.
          - A new opaque refresh token.

        The previous refresh token is consumed atomically.
        The replacement refresh token belongs to the same
        account and the same login session.

        Refresh-token rotation does not extend the session's
        original absolute 30-day expiry.

        The endpoint uses the refresh token in the JSON
        request body as its credential. A bearer Authorization
        header is not required and is ignored, including
        when it contains an expired access token.

        Rotation and reuse detection are coordinated through
        PostgreSQL transactions and row locks.

        If a previously consumed refresh token is presented
        again while its session is usable, the entire affected
        session is revoked. This invalidates newer refresh
        tokens and access tokens of that session.

        There is no reuse grace period.

        If two requests concurrently present the same current
        refresh token, at most one rotates successfully.
        The other is treated as reuse, revoking the session.

        A revoked or expired session cannot be renewed.
        Other independent login sessions remain unaffected.

        Clients must perform at most one refresh operation
        at a time per session and atomically replace the
        stored refresh token after successful rotation.

        If the response is lost after the transaction commits,
        retrying the old token triggers reuse detection.
        The client must authenticate again.

      security: []

      requestBody:
        required: true
        description: The current opaque refresh token.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refreshToken: "q8lC2vExampleOpaqueRefreshToken"

      responses:
        "200":
          description: |
            Refresh succeeded.

            Returns a new access token and a new refresh token.
            The account ID and absolute session expiry remain
            unchanged.
          headers:
            Cache-Control:
              description: Prevents caching of returned credentials.
              schema:
                type: string
              example: "no-cache, no-store, max-age=0, must-revalidate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                tokenType: "Bearer"
                accountId: "a61b2b35-8b7e-4c51-93d1-51d81a4d82e2"
                accessToken: "eyJhbGciOiJIUzI1NiJ9.newExample.signature"
                accessTokenExpiresAt: "2026-11-03T10:30:00Z"
                refreshToken: "NewOpaqueRefreshTokenAfterRotation"
                sessionExpiresAt: "2026-12-03T10:00:00Z"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/RenewalRejected"

        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/password-reset/request:
    post:
      tags:
        - Identity
      operationId: requestPasswordReset
      summary: Request password-reset instructions by email
      description: |
        US-AUTH-005 (FR-AUTH-003, FR-AUTH-018, FR-AUTH-019, SI-003).

        Requests are limited per normalized email address and per
        client address in fixed windows. Over a limit the answer
        is 429 RATE_LIMITED, identical for registered and
        unregistered addresses. A successful request is paced to a
        minimum response time whether or not instructions were
        issued. 202 means the request was accepted, not that an
        email was delivered. The emailed link is the configured
        HTTPS App/Universal Link with the secret in the fragment
        (#token=...).

        For a registered email, issues a new single-use reset
        interaction valid for 30 minutes and emails its link.
        Issuing replaces every earlier unused interaction of
        that account. For an unregistered email nothing is
        issued or sent.

        The response is identical in both cases and never says
        whether an account exists or that a password changed.
        Email delivery happens after the response; a delivery
        failure does not change the response. Nothing about the
        password or the sessions changes.

        Email is compared case-insensitively after trimming
        surrounding whitespace. A bearer Authorization header is
        ignored.

      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: "person@example.com"

      responses:
        "202":
          description: |
            The request was accepted. Instructions were sent if an
            account exists for the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestedResponse"
              example:
                code: "PASSWORD_RESET_REQUESTED"
                detail: "If an account exists for this email, password-reset instructions have been sent."

        "400":
          $ref: "#/components/responses/BadRequest"

        "429":
          $ref: "#/components/responses/RateLimited"

        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/password-reset/check:
    post:
      tags:
        - Identity
      operationId: checkPasswordReset
      summary: Check that an opened reset link is still usable
      description: |
        US-AUTH-005 AC-06/AC-08.

        Lets the client decide whether to show the new-password
        form after the user opens an emailed link. It changes
        nothing: opening does not extend, consume or replace the
        interaction, and completion checks validity again.

      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCheckRequest"
            example:
              token: "Zk3v9ExampleResetSecretFromTheEmailLink"

      responses:
        "204":
          description: The interaction is usable now.

        "400":
          description: |
            VALIDATION_FAILED when the token is missing, or
            PASSWORD_RESET_INVALID when the interaction is unknown,
            expired, already used or replaced.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                linkNoLongerUsable:
                  $ref: "#/components/examples/PasswordResetInvalid"

        "429":
          $ref: "#/components/responses/RateLimited"

        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/password-reset/complete:
    post:
      tags:
        - Identity
      operationId: completePasswordReset
      summary: Set a new password with a reset link
      description: |
        US-AUTH-005 (FR-AUTH-004, FR-AUTH-015, FR-AUTH-017,
        BRULE-AUTH-005).

        In one transaction: sets the exact new password,
        consumes the interaction and revokes every active login
        session of the account. Their access and refresh tokens
        stop working at once. The user must then log in with
        the new password; no tokens are returned.

        The interaction is checked again at submission. A
        policy-breaking password is rejected without consuming
        the interaction, so the user can correct it.

        If the response is lost, submitting the same link again
        returns PASSWORD_RESET_INVALID when the first submission
        succeeded; logging in with the new password confirms it.

      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompletionRequest"
            example:
              token: "Zk3v9ExampleResetSecretFromTheEmailLink"
              newPassword: "a brand new passphrase"

      responses:
        "204":
          description: |
            The password was changed, the interaction consumed and
            every session revoked. Log in with the new password.

        "400":
          description: |
            VALIDATION_FAILED for a missing token or a new password
            that breaks the policy (the interaction stays usable),
            or PASSWORD_RESET_INVALID when the interaction is
            unknown, expired, already used or replaced. Nothing
            was changed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                passwordTooShort:
                  summary: New password breaks the policy
                  value:
                    title: "Bad Request"
                    status: 400
                    detail: "Some submitted values are missing or invalid. Correct them and submit again."
                    instance: "/api/v1/auth/password-reset/complete"
                    code: "VALIDATION_FAILED"
                    fieldErrors:
                      - field: "newPassword"
                        code: "TOO_SHORT"
                linkNoLongerUsable:
                  $ref: "#/components/examples/PasswordResetInvalid"

        "429":
          $ref: "#/components/responses/RateLimited"

        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/wardrobe/garments:
    get:
      tags:
        - Wardrobe
      operationId: browseWardrobe
      summary: List the current wardrobe
      description: |
        US-WAR-001 (FR-WAR-001, FR-WAR-008, BRULE-HIST-002).

        Returns one page of the authenticated account's current
        confirmed garments, newest first (created time, then id,
        both descending). Each summary identifies the
        garment through Category, Color and, when supplied,
        Subtype and Brand; a minimum-only garment is listed like
        any other. No image is stored in this release, so clients
        show a category/color placeholder. Removed garments, other
        accounts' garments and unconfirmed drafts never appear.

        Pages (OPEN-S2-10): omit cursor for the first page. When
        nextCursor is a string, send it back unchanged as cursor
        to load the following page; null means this is the last
        page. The cursor is opaque: do not build, parse or store
        it beyond the current browsing session. A garment added
        while paging appears when the overview is loaded again
        from the first page; a removed garment disappears; no
        current garment is repeated or skipped.

        200 with an empty first page means the wardrobe is
        genuinely empty. A 400, 401 or 503 is never an empty
        wardrobe. Browsing changes nothing. There is no sorting
        option, filter or search in this release.

      parameters:
        - name: limit
          in: query
          required: false
          description: Garments per page, from 1 to 100. Default 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            The nextCursor of the previous page, unchanged. An
            altered or unknown value is rejected with 400; it
            never restarts or ends the overview silently.
          schema:
            type: string
            maxLength: 200
            pattern: "^[A-Za-z0-9_-]+$"

      responses:
        "200":
          description: The current wardrobe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WardrobeOverview"
              examples:
                populated:
                  summary: A first page (limit=2) with more garments to follow
                  value:
                    garments:
                      - id: "4b9f3c7e-2a1d-4c8e-9f6a-1e2d3c4b5a69"
                        category: "TOPS"
                        subtype: "T_SHIRTS"
                        color: "NAVY"
                        brand: "Uniqlo"
                        recommendationEligibility: "NOT_EVALUATED"
                        createdAt: "2026-11-05T09:31:00.123456Z"
                      - id: "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"
                        category: "SHOES"
                        subtype: null
                        color: "BLACK"
                        brand: null
                        recommendationEligibility: "NOT_EVALUATED"
                        createdAt: "2026-11-05T09:30:00.123456Z"
                    nextCursor: "djF8MjAyNi0xMS0wNVQwOTozMDowMC4xMjM0NTZafDlhOGI3YzZkLTVlNGYtNGEzYi04YzJkLTFlMGY5YThiN2M2ZA"
                empty:
                  summary: A genuinely empty wardrobe
                  value:
                    garments: []
                    nextCursor: null

        "400":
          $ref: "#/components/responses/PageRequestRejected"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "503":
          $ref: "#/components/responses/Unavailable"

    post:
      tags:
        - Wardrobe
      operationId: addGarment
      summary: Add one explicitly confirmed garment manually
      description: |
        US-GAR-001 (FR-AI-003/008/010, FR-GAR-001–013, BRULE-GAR-001–006/010).

        Saves one garment for the authenticated account when the
        user explicitly confirmed (confirmed: true) a supported
        Category and one dominant Color. Every other property is
        optional; an image or AI analysis is never required.

        Supplied values must be codes of the approved vocabularies
        and apply to the category: Fit, Neckline and Sleeve Length
        only for TOPS; Length from the TOPS or PANTS list only for
        that category; Silhouette only for PANTS. An invalid or
        inapplicable value is reported in fieldErrors for
        correction or clearing; nothing is replaced, discarded or
        saved. Material and Style are arrays: zero, one or several
        approved codes, and a repeated code collapses into one.

        Brand, when supplied, is kept exactly as entered (at most
        100 Unicode code points); a blank Brand means none. Price,
        when supplied, is the amount originally paid as a decimal
        string plus an ISO 4217 currency, both together; 0 is a
        valid Price, a missing Price is unknown, and the amount is
        never converted or rounded.

        The Idempotency-Key header names the logical addition.
        Repeating the same addition (same key and values), for
        example after a lost response, returns 200 with the garment
        that was already saved; it never creates a second one. A
        new key is a new addition, so identical-looking garments
        can be added separately. Reusing a key with different
        values is rejected with 422.

      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GarmentCreationRequest"
            examples:
              fullTop:
                summary: A Top with every applicable property
                value:
                  confirmed: true
                  category: "TOPS"
                  subtype: "T_SHIRTS"
                  color: "NAVY"
                  materials:
                    - "COTTON"
                    - "SPANDEX_ELASTANE"
                  pattern: "STRIPED"
                  styles:
                    - "CASUAL"
                    - "MINIMALIST"
                  fit: "REGULAR"
                  neckline: "ROUND"
                  sleeveLength: "SHORT_SLEEVE"
                  length: "HIP"
                  brand: "Uniqlo"
                  price:
                    amount: "299000"
                    currency: "VND"
              minimum:
                summary: The confirmed Saveable minimum
                value:
                  confirmed: true
                  category: "SHOES"
                  color: "BLACK"

      responses:
        "201":
          description: The garment was created by this request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garment"
              example:
                id: "4b9f3c7e-2a1d-4c8e-9f6a-1e2d3c4b5a69"
                category: "SHOES"
                subtype: null
                color: "BLACK"
                materials: []
                pattern: null
                styles: []
                fit: null
                neckline: null
                sleeveLength: null
                length: null
                silhouette: null
                brand: null
                price: null
                provenance: "USER_ENTERED"
                recommendationEligibility: "NOT_EVALUATED"
                createdAt: "2026-11-05T09:30:00.123456Z"

        "200":
          description: |
            The same logical addition was already accepted; this is
            that garment. Nothing new was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garment"

        "400":
          $ref: "#/components/responses/GarmentRejected"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"

        "503":
          $ref: "#/components/responses/Unavailable"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A UUID the client generates once per intended garment
        addition and repeats unchanged on every retry of it.
      schema:
        type: string
        format: uuid
      example: "6f1c2a8e-9b3d-4e5f-a1b2-c3d4e5f60718"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token sent as:

          Authorization: Bearer <accessToken>

        Access tokens:
          - Are signed with HS256.
          - Have issuer capsuleai-identity.
          - Include sub (account UUID).
          - Include sid (session UUID).
          - Include iat and exp timestamps.
          - Have a maximum lifetime of 15 minutes.
          - Must belong to a currently usable database session.

        JWT validity alone does not grant access.
        PostgreSQL session authority is checked on every
        protected request.

  schemas:
    RegistrationRequest:
      type: object
      description: |
        Registration input for US-AUTH-001.

        Email is normalized before identity comparison.
        Password and confirmation are preserved exactly
        as supplied.
      required:
        - email
        - password
        - confirmPassword
      properties:
        email:
          type: string
          minLength: 1
          description: |
            Email address to register.

            Surrounding whitespace is trimmed before
            validation and identity comparison.
            Comparison is case-insensitive.

            The normalized email must be unique.
          examples:
            - " Person@Example.com "

        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: |
            Password containing 12–128 Unicode code points.

            Leading and trailing spaces are significant.
            The value is not trimmed or normalized.

            The password is never returned by the API.
          examples:
            - "correct horse battery staple"

        confirmPassword:
          type: string
          format: password
          writeOnly: true
          description: |
            Repetition of the password (FR-AUTH-001,
            FR-AUTH-012).

            Missing or empty is REQUIRED; any difference from
            password, including spaces or letter case, is
            MISMATCH. Never returned by the API.
          examples:
            - "correct horse battery staple"

        displayName:
          type:
            - string
            - "null"
          maxLength: 100
          description: |
            Optional display name of at most 100 Unicode
            code points, stored exactly as supplied.

            Omitted, null or blank means no display name.
          examples:
            - "Person"

    RegistrationResponse:
      type: object
      description: Account created by registration.
      required:
        - accountId
        - email
        - displayName
      properties:
        accountId:
          type: string
          format: uuid
          description: Identifier of the registered account.

        email:
          type: string
          description: Normalized account email.

        displayName:
          type:
            - string
            - "null"
          description: The stored display name, or null when none was given.

    LoginRequest:
      type: object
      description: Credentials used to create a login session.
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 1
          description: |
            Account email.

            Surrounding whitespace and case differences
            do not change which account is selected.
          examples:
            - " Person@Example.com "

        password:
          type: string
          format: password
          writeOnly: true
          description: |
            Exact password supplied by the caller.

            Unlike registration, login does not reapply
            the registration password-length policy.

            The password is compared without trimming
            or Unicode normalization.
          examples:
            - "correct horse battery staple"

    RefreshRequest:
      type: object
      description: |
        Current refresh credential used to renew a session.
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            Opaque refresh token issued by login or the
            previous successful refresh operation.

            Missing or blank values are rejected with 400.
            Unknown, consumed, or unusable tokens result
            in 401.

    TokenResponse:
      type: object
      description: |
        Authentication credentials returned by login
        and successful refresh.

        The access token is an HS256 JWT.

        The refresh token is opaque and must be replaced
        after every successful refresh.

        sessionExpiresAt is the original absolute session
        expiry and does not move forward during rotation.
      required:
        - tokenType
        - accountId
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - sessionExpiresAt
      properties:
        tokenType:
          type: string
          const: Bearer
          description: Authorization scheme for the access token.

        accountId:
          type: string
          format: uuid
          description: Authenticated account identifier.

        accessToken:
          type: string
          description: |
            Signed JWT access token.

            Send in the Authorization header of protected
            requests using the Bearer scheme.

        accessTokenExpiresAt:
          type: string
          format: date-time
          description: |
            Absolute expiry of the returned access token.

            At this instant the access token is no longer
            valid. Its lifetime never exceeds 15 minutes
            or the remaining session lifetime.

        refreshToken:
          type: string
          description: |
            Current opaque refresh token.

            Generated from 32 cryptographically secure
            random bytes and encoded as unpadded Base64url.

            Only its SHA-256 hash is stored by the server.

            Never reuse after successful rotation.

        sessionExpiresAt:
          type: string
          format: date-time
          description: |
            Absolute session expiry established at login.

            At this instant the session becomes unusable.
            Refresh operations never extend this value.

    PasswordResetRequest:
      type: object
      description: Email of the account to recover.
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
          description: |
            Compared case-insensitively after trimming
            surrounding whitespace; provider aliases are not
            merged. A missing or malformed value is rejected
            with 400 regardless of account existence.

    PasswordResetRequestedResponse:
      type: object
      description: |
        The single response to every accepted Forgot Password
        request, whether or not an account exists.
      required:
        - code
        - detail
      properties:
        code:
          type: string
          const: PASSWORD_RESET_REQUESTED
        detail:
          type: string

    PasswordResetCheckRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: The reset secret from the emailed link fragment.

    PasswordResetCompletionRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: The reset secret from the emailed link fragment.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: |
            12–128 Unicode characters, kept exactly as entered:
            no trimming, normalization or character-class rules.

    GarmentCreationRequest:
      type: object
      description: |
        A manual garment entry. Omit an optional property, or send
        null, when it was not supplied; blank strings count as not
        supplied. There is no owner field: the owner is the
        authenticated account.
      required:
        - confirmed
        - category
        - color
      properties:
        confirmed:
          type: boolean
          description: Must be true. false or missing creates nothing.
        category:
          $ref: "#/components/schemas/GarmentCategoryCode"
        subtype:
          anyOf:
            - $ref: "#/components/schemas/GarmentSubtypeCode"
            - type: "null"
        color:
          $ref: "#/components/schemas/GarmentColorCode"
        materials:
          type: array
          description: Zero or more Materials; repeated values collapse into one.
          items:
            $ref: "#/components/schemas/GarmentMaterialCode"
        pattern:
          anyOf:
            - $ref: "#/components/schemas/GarmentPatternCode"
            - type: "null"
        styles:
          type: array
          description: Zero or more Styles; repeated values collapse into one.
          items:
            $ref: "#/components/schemas/GarmentStyleCode"
        fit:
          anyOf:
            - $ref: "#/components/schemas/GarmentFitCode"
            - type: "null"
        neckline:
          anyOf:
            - $ref: "#/components/schemas/GarmentNecklineCode"
            - type: "null"
        sleeveLength:
          anyOf:
            - $ref: "#/components/schemas/GarmentSleeveLengthCode"
            - type: "null"
        length:
          anyOf:
            - $ref: "#/components/schemas/GarmentLengthCode"
            - type: "null"
        silhouette:
          anyOf:
            - $ref: "#/components/schemas/GarmentSilhouetteCode"
            - type: "null"
        brand:
          type: [string, "null"]
          maxLength: 100
          description: |
            Kept exactly as entered, including case, accents and
            spaces; at most 100 Unicode code points; free text, not
            a catalogue. Blank means not supplied.
        price:
          anyOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"

    Price:
      type: object
      description: |
        The user-reported amount originally paid. Never a market,
        resale or retailer value; never converted.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]+)?$"
          description: |
            Exact non-negative decimal string, at most 12 integer
            digits and no more decimals than the currency's ISO
            4217 minor unit (VND 0, USD 2). Never rounded.
          examples:
            - "299000"
            - "12.50"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Upper-case ISO 4217 code of a real currency.
          examples:
            - "VND"

    Garment:
      type: object
      description: |
        One garment owned by the authenticated account, with every
        accepted value. Every field is always present: a property
        that was not supplied, or does not apply to the category,
        is null, and no Material or Style is []. Codes are those of the
        vocabulary schemas.
      required:
        - id
        - category
        - subtype
        - color
        - materials
        - pattern
        - styles
        - fit
        - neckline
        - sleeveLength
        - length
        - silhouette
        - brand
        - price
        - provenance
        - recommendationEligibility
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/GarmentCategoryCode"
        subtype:
          anyOf:
            - $ref: "#/components/schemas/GarmentSubtypeCode"
            - type: "null"
        color:
          $ref: "#/components/schemas/GarmentColorCode"
        materials:
          type: array
          description: Distinct Materials in catalogue order.
          items:
            $ref: "#/components/schemas/GarmentMaterialCode"
        pattern:
          anyOf:
            - $ref: "#/components/schemas/GarmentPatternCode"
            - type: "null"
        styles:
          type: array
          description: Distinct Styles in catalogue order.
          items:
            $ref: "#/components/schemas/GarmentStyleCode"
        fit:
          anyOf:
            - $ref: "#/components/schemas/GarmentFitCode"
            - type: "null"
        neckline:
          anyOf:
            - $ref: "#/components/schemas/GarmentNecklineCode"
            - type: "null"
        sleeveLength:
          anyOf:
            - $ref: "#/components/schemas/GarmentSleeveLengthCode"
            - type: "null"
        length:
          anyOf:
            - $ref: "#/components/schemas/GarmentLengthCode"
            - type: "null"
        silhouette:
          anyOf:
            - $ref: "#/components/schemas/GarmentSilhouetteCode"
            - type: "null"
        brand:
          type: [string, "null"]
        price:
          anyOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        provenance:
          type: string
          const: USER_ENTERED
          description: Every accepted value was entered and confirmed by the user.
        recommendationEligibility:
          type: string
          const: NOT_EVALUATED
          description: |
            No recommendation-eligibility policy is approved yet. A
            garment is never called ready, unsuitable or ineligible.
        createdAt:
          type: string
          format: date-time

    WardrobeOverview:
      type: object
      description: One page of the current wardrobe, newest first.
      required:
        - garments
        - nextCursor
      properties:
        garments:
          type: array
          maxItems: 100
          description: |
            Current garments, newest first; [] on the first page
            only when the wardrobe is empty.
          items:
            $ref: "#/components/schemas/GarmentSummary"
        nextCursor:
          type: [string, "null"]
          description: |
            Opaque position after the last garment of this page.
            Send it as cursor to load the next page; null on the
            last page.

    GarmentSummary:
      type: object
      description: |
        Enough to recognize and select a garment. Subtype and
        Brand are null when not supplied. Detail returns every
        accepted property.
      required:
        - id
        - category
        - subtype
        - color
        - brand
        - recommendationEligibility
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/GarmentCategoryCode"
        subtype:
          anyOf:
            - $ref: "#/components/schemas/GarmentSubtypeCode"
            - type: "null"
        color:
          $ref: "#/components/schemas/GarmentColorCode"
        brand:
          type: [string, "null"]
        recommendationEligibility:
          type: string
          const: NOT_EVALUATED
        createdAt:
          type: string
          format: date-time

