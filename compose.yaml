name: capsuleai-dev

services:
  postgres:
    image: postgres:17.11-bookworm

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # US-AUTH-005: local SMTP sink for password-reset emails. Nothing is relayed
  # outside this machine; read received mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.11

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # US-GAR-003 (S3-IMG-01, OPEN-S3-13): local S3-compatible private photo storage for development
  # only. Objects live inside the container; this is not the production provider. Both variable
  # spellings create the bucket; which one 5.1.0 honours is part of verification V-S3.
  s3mock:
    image: adobe/s3mock:5.1.0

    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: capsuleai-photos-local
      initialBuckets: capsuleai-photos-local

    ports:
      - "127.0.0.1:9090:9090"

volumes:
  pgdata:
